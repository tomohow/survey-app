<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>水準測量</title>
<style>
:root{
  --bg:#0a0a0f;
  --sf:#13131a;
  --sf2:#1c1c27;
  --bd:#2a2a3a;
  --ac:#4f8ef7;
  --pl:#34d399;
  --mn:#f87171;
  --tx:#f0f0f8;
  --mu:#7070a0;
  --r:12px;
  --rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;
  background:var(--bg);color:var(--tx);
  display:flex;flex-direction:column;
}

/* ヘッダー固定 */
.hdr{
  flex:0 0 auto;
  background:linear-gradient(160deg,#0c1a2e 0%,#0a0a0f 70%);
  border-bottom:2px solid rgba(79,142,247,.25);
  padding:env(safe-area-inset-top,0) 14px 0;
  position:relative;overflow:hidden;
}
.hdr::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 17px,rgba(79,142,247,.05) 17px,rgba(79,142,247,.05) 18px);
  pointer-events:none;
}
.hdr::after{
  content:'';position:absolute;top:0;bottom:0;left:50px;width:1px;
  background:rgba(248,113,113,.2);pointer-events:none;
}
.hdr-top{display:flex;align-items:center;gap:10px;padding:9px 0 6px;position:relative;}
.app-logo{flex:0 0 auto;width:34px;height:34px;}
.app-title-wrap{flex:1;min-width:0;}
.app-title{
  font-size:15px;font-weight:800;letter-spacing:.05em;line-height:1.15;
  background:linear-gradient(90deg,#ddeeff 0%,#7eb8ff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.app-sub{font-size:8.5px;color:var(--mu);letter-spacing:.12em;font-weight:600;margin-top:1px;text-transform:uppercase;}
.time-badge{flex:0 0 auto;font-size:11px;color:var(--mu);background:var(--sf);padding:3px 9px;border-radius:16px;border:1px solid var(--bd);font-variant-numeric:tabular-nums;}
.tabs{display:flex;gap:3px;padding:5px 0;position:relative;}
.tab{flex:1;padding:7px 4px;font-size:12px;font-weight:700;border:none;border-radius:var(--rs);cursor:pointer;color:var(--mu);background:transparent;letter-spacing:.02em;}
.tab.active{background:linear-gradient(135deg,#2d6cc0,#4f8ef7);color:#fff;box-shadow:0 2px 8px rgba(79,142,247,.3);}

/* コンテンツ全体 */
.sec{display:none;flex:1 1 auto;overflow:hidden;}
.sec.active{display:flex;flex-direction:column;}

/* ── 設定タブ ── */
.setup-scroll{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0));}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;}
.card-lbl{font-size:10px;color:var(--mu);font-weight:700;letter-spacing:.06em;margin-bottom:8px;}
.fields{display:flex;flex-direction:column;gap:7px;}
.flbl{font-size:10px;color:var(--mu);font-weight:600;letter-spacing:.04em;margin-bottom:2px;}
.row2{display:flex;gap:8px;}
.row2>*{flex:1;}
input[type=text],input[type=number],input[type=datetime-local]{
  width:100%;background:var(--sf2);border:1px solid var(--bd);
  color:var(--tx);font-size:15px;padding:10px 12px;
  border-radius:var(--rs);outline:none;-webkit-appearance:none;
}
input:focus{border-color:var(--ac);}
input::placeholder{color:var(--mu);}
input[type=datetime-local]{color-scheme:dark;}
.btn{width:100%;padding:13px;font-size:15px;font-weight:700;border:none;border-radius:var(--r);cursor:pointer;-webkit-appearance:none;}
.btn:active{opacity:.75;}
.btn-p{background:var(--ac);color:#fff;}
.btn-s{background:var(--sf2);color:var(--tx);border:1px solid var(--bd);}
.btn-d{background:rgba(248,113,113,.12);color:var(--mn);border:1px solid rgba(248,113,113,.25);}

/* ── 測定タブ ── */
#tab-measure{flex-direction:column;}

/* テーブル領域 */
.tbl-area{
  flex:1 1 auto;
  overflow-y:auto;
  padding:10px 16px 6px;
}
.tbl-box{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;}
col.c-tog{width:36px;}
col.c-pt{width:auto;}
col.c-sp{width:46px;}
col.c-ih{width:46px;}
col.c-fs{width:46px;}
col.c-gh{width:54px;}
col.c-del{width:30px;}
thead th{
  background:var(--sf2);padding:7px 2px;
  font-size:9px;font-weight:700;color:var(--mu);letter-spacing:.04em;
  text-align:center;border-bottom:1px solid var(--bd);
  position:sticky;top:0;z-index:2;
}
tbody tr{border-bottom:1px solid rgba(42,42,58,.8);}
tbody tr:last-child{border-bottom:none;}
tbody tr.off{opacity:.28;}
td{padding:7px 2px;text-align:center;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.td-pt{text-align:left;padding-left:6px;font-weight:600;font-size:11px;}
.bm-badge{font-size:8px;background:rgba(79,142,247,.2);color:var(--ac);padding:1px 4px;border-radius:6px;border:1px solid rgba(79,142,247,.4);margin-left:2px;vertical-align:middle;}
.fs-plus{color:var(--pl);font-weight:600;}
.fs-minus{color:var(--mn);font-weight:600;}
.gh-tap{cursor:pointer;text-decoration:underline dotted rgba(112,112,160,.5);}
.ih-chg{color:var(--ac);font-weight:700;}
.tog-btn{font-size:8px;padding:2px 3px;border-radius:4px;border:1px solid var(--bd);background:transparent;color:var(--mu);cursor:pointer;line-height:1.3;}
.tog-btn.on{border-color:var(--pl);color:var(--pl);}
.del-btn{background:transparent;border:1px solid rgba(248,113,113,.25);color:var(--mn);font-size:12px;font-weight:700;cursor:pointer;border-radius:4px;padding:2px 5px;line-height:1;}

/* グラフ固定帯 */
.graph-strip{
  flex:0 0 auto;
  padding:0 16px 6px;
}
.graph-box{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:8px 10px;}
.graph-lbl{font-size:9px;color:var(--mu);font-weight:700;letter-spacing:.05em;margin-bottom:4px;}
#chart-inline{width:100%;height:80px;display:block;}

/* フッター入力 */
.footer{
  flex:0 0 auto;
  background:var(--bg);border-top:1px solid var(--bd);
  padding:8px 16px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom,0));
}
.footer-inner{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:10px;}
.ih-bar{
  display:flex;align-items:center;gap:5px;
  padding:5px 8px;margin-bottom:7px;
  background:rgba(79,142,247,.1);border:1px solid rgba(79,142,247,.3);
  border-radius:var(--rs);font-size:11px;
}
.ih-lbl{color:var(--mu);font-size:10px;}
.ih-val{color:var(--ac);font-weight:700;font-size:12px;}
.ih-src{color:var(--mu);font-size:9px;}
.ih-rst{margin-left:auto;font-size:10px;background:transparent;border:none;color:var(--mu);cursor:pointer;text-decoration:underline;}
.inp-row{display:flex;gap:6px;margin-bottom:7px;align-items:flex-end;}
.inp-row .fi{flex:1;display:flex;flex-direction:column;gap:2px;}
.inp-row .fi-lg{flex:1.5;}
.inp-row input{padding:8px 8px;font-size:14px;}
.add-btn{flex:0 0 auto;padding:8px 16px;font-size:14px;font-weight:700;
  background:var(--ac);color:#fff;border:none;border-radius:var(--rs);cursor:pointer;}
.add-btn:active{opacity:.75;}

/* グラフタブ */
.graph-scroll{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0));}
#chart-full{width:100%;height:200px;display:block;}

/* 空状態 */
.empty{text-align:center;padding:28px 16px;color:var(--mu);}
.empty-ico{font-size:30px;margin-bottom:6px;}
.empty-txt{font-size:12px;}

/* モーダル */
.overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.78);align-items:flex-end;}
.overlay.open{display:flex;}
.modal{background:var(--sf);border:1px solid var(--bd);border-radius:20px 20px 0 0;padding:22px 20px;width:100%;padding-bottom:calc(22px + env(safe-area-inset-bottom,0));}
.modal-t{font-size:15px;font-weight:700;margin-bottom:3px;}
.modal-s{font-size:12px;color:var(--mu);margin-bottom:10px;}
.modal-v{font-size:34px;font-weight:700;color:var(--ac);text-align:center;margin:12px 0;}
.modal-n{font-size:11px;color:var(--mu);text-align:center;margin-bottom:14px;}
.modal-a{display:flex;gap:8px;}

/* 定点観測タブ */
.dp-wrap{
  display:flex;flex-direction:column;
  height:100%;overflow:hidden;
}
.dp-viewer{
  flex:1 1 auto;
  position:relative;overflow:hidden;
  background:#000;min-height:0;
}
.dp-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:10px;color:var(--mu);
}
.dp-empty-ico{font-size:40px;}
.dp-empty-txt{font-size:13px;}
.dp-upload-btn{
  display:inline-block;cursor:pointer;
  padding:10px 24px;font-size:14px;font-weight:700;
  border-radius:var(--r);border:none;
  background:var(--ac);color:#fff;
}
.dp-compare{position:relative;width:100%;height:100%;}
.dp-base-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;z-index:2;pointer-events:none;
}
.dp-video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;z-index:1;background:#000;
}
.dp-grid{
  position:absolute;inset:0;width:100%;height:100%;
  z-index:3;pointer-events:none;
}
.dp-date-badge{
  position:absolute;top:8px;left:8px;z-index:4;
  background:rgba(0,0,0,.6);color:#fff;
  font-size:10px;padding:3px 8px;border-radius:8px;
  backdrop-filter:blur(4px);
}
.dp-panel{
  flex:0 0 auto;
  background:var(--sf);border-top:1px solid var(--bd);
  padding:8px 16px;
}
.dp-ctrl-row{
  display:flex;align-items:center;gap:8px;margin-bottom:6px;
}
.dp-ctrl-row:last-child{margin-bottom:0;}
.dp-ctrl-lbl{font-size:11px;color:var(--mu);width:48px;flex-shrink:0;}
.dp-ctrl-val{font-size:11px;color:var(--ac);width:36px;text-align:right;flex-shrink:0;}
.dp-slider{
  flex:1;-webkit-appearance:none;appearance:none;
  height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--ac) var(--val,50%),var(--bd) var(--val,50%));
  outline:none;cursor:pointer;
}
.dp-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;
  border-radius:50%;background:var(--ac);cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.4);
}
.dp-tog{
  padding:4px 14px;font-size:11px;font-weight:700;
  border-radius:6px;border:1px solid var(--bd);
  background:var(--sf2);color:var(--mu);cursor:pointer;
}
.dp-tog.active{border-color:var(--pl);color:var(--pl);background:rgba(52,211,153,.1);}
.dp-btns{
  flex:0 0 auto;
  padding:8px 16px;
  background:var(--bg);border-top:1px solid var(--bd);
}
.dp-history{
  flex:0 0 auto;max-height:120px;overflow-y:auto;
  background:var(--bg);border-top:1px solid var(--bd);padding:8px 0;
}
.dp-hist-item{
  display:flex;align-items:center;gap:10px;
  padding:6px 16px;cursor:pointer;
}
.dp-hist-item:hover{background:var(--sf);}
.dp-hist-thumb{width:40px;height:28px;object-fit:cover;border-radius:4px;border:1px solid var(--bd);}
.dp-hist-info{flex:1;min-width:0;}
.dp-hist-date{font-size:11px;color:var(--tx);}
.dp-hist-del{font-size:12px;color:var(--mn);background:transparent;border:none;padding:4px 8px;cursor:pointer;}

/* オフラインバナー */
.offline-banner{
  display:none;
  background:rgba(248,113,113,.15);border-bottom:1px solid rgba(248,113,113,.3);
  color:var(--mn);font-size:11px;text-align:center;padding:4px;
}
.offline-banner.show{display:block;}
</style>
</head>
<body>

<!-- オフライン通知 -->
<div class="offline-banner" id="offline-banner">⚠️ オフライン — データはローカルに保存されています</div>

<div class="hdr">
  <div class="hdr-top">
    <!-- SVGロゴ：レベルブック + 水準儀モチーフ -->
    <svg class="app-logo" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 測量手帳ベース -->
      <rect x="3" y="2" width="22" height="29" rx="2.5" fill="#1a2f50" stroke="#3a6ab5" stroke-width="1"/>
      <!-- 罫線 -->
      <line x1="7" y1="9" x2="21" y2="9" stroke="rgba(160,196,255,0.4)" stroke-width="0.8"/>
      <line x1="7" y1="13" x2="21" y2="13" stroke="rgba(160,196,255,0.4)" stroke-width="0.8"/>
      <line x1="7" y1="17" x2="21" y2="17" stroke="rgba(160,196,255,0.4)" stroke-width="0.8"/>
      <line x1="7" y1="21" x2="21" y2="21" stroke="rgba(160,196,255,0.4)" stroke-width="0.8"/>
      <!-- 縦赤線（余白線） -->
      <line x1="9" y1="6" x2="9" y2="28" stroke="rgba(248,113,113,0.5)" stroke-width="0.9"/>
      <!-- 水準儀シルエット（右下オーバーレイ） -->
      <circle cx="26" cy="25" r="7" fill="#0d1b2e" stroke="#3a6ab5" stroke-width="1"/>
      <!-- 気泡管（水平線） -->
      <line x1="20" y1="25" x2="32" y2="25" stroke="#4f8ef7" stroke-width="1"/>
      <!-- 気泡（楕円） -->
      <ellipse cx="26" cy="25" rx="2.5" ry="1.4" fill="#34d399" opacity="0.9"/>
      <!-- 三脚の上部 -->
      <line x1="26" y1="18.5" x2="26" y2="20" stroke="#7eb8ff" stroke-width="1"/>
    </svg>
    <div class="app-title-wrap">
      <div class="app-title">水準測量野帳</div>
      <div class="app-sub">Level Field Book</div>
    </div>
    <div class="time-badge" id="time">--:--</div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="setup">設定</button>
    <button class="tab" data-tab="measure">測定</button>
    <button class="tab" data-tab="graph">グラフ</button>
    <button class="tab" data-tab="env">環境</button>
  </div>
</div>

<!-- 設定 -->
<div class="sec active" id="tab-setup">
  <div class="setup-scroll">
    <div class="card">
      <div class="card-lbl">📍 現場情報</div>
      <div class="fields">
        <div><div class="flbl">地点名</div><input id="place" type="text" placeholder="例：○○地区 △△工区"></div>
        <div class="row2">
          <div><div class="flbl">観測者①</div><input id="observer1" type="text" placeholder="名前"></div>
          <div><div class="flbl">観測者②</div><input id="observer2" type="text" placeholder="名前"></div>
        </div>
        <div><div class="flbl">測定日時</div><input id="survey-date" type="datetime-local"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-lbl">🔩 BM設定</div>
      <div class="fields">
        <div><div class="flbl">BM測点名</div><input id="bmName" type="text" placeholder="例：BM.1"></div>
        <div><div class="flbl">初期GH（標高）</div><input id="initGH" type="text" inputmode="url" pattern="-?[0-9]*\.?[0-9]*" placeholder="例：10.000" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"></div>
      </div>
    </div>
    <button class="btn btn-p" onclick="setInit()">測定開始</button>
    <button class="btn btn-s" onclick="downloadCSV()">📥 CSVダウンロード</button>
    <button class="btn btn-d" onclick="clearAll()">データをリセット</button>
  </div>
</div>

<!-- 測定 -->
<div class="sec" id="tab-measure">

  <!-- テーブル（スクロール） -->
  <div class="tbl-area">
    <div class="tbl-box">
      <div class="empty" id="empty-state">
        <div class="empty-ico">📋</div>
        <div class="empty-txt">設定タブからBMを登録してください</div>
      </div>
      <table id="data-table" style="display:none;">
        <colgroup>
          <col class="c-tog"><col class="c-pt">
          <col class="c-sp"><col class="c-ih"><col class="c-fs"><col class="c-gh">
          <col class="c-del">
        </colgroup>
        <thead>
          <tr>
            <th>表示</th>
            <th style="text-align:left;padding-left:6px;">測点</th>
            <th>SP</th><th>IH</th><th>FS</th><th>GH▼</th><th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- グラフ固定帯 -->
  <div class="graph-strip">
    <div class="graph-box">
      <div class="graph-lbl">GH プロファイル</div>
      <canvas id="chart-inline"></canvas>
    </div>
  </div>

  <!-- 入力フッター -->
  <div class="footer">
    <div class="footer-inner">
      <div class="ih-bar">
        <span class="ih-lbl">IH</span>
        <span class="ih-val" id="ih-val">--</span>
        <span class="ih-src" id="ih-src"></span>
        <button class="ih-rst" id="ih-rst" onclick="resetIH()" style="display:none;">元に戻す</button>
      </div>
      <div class="inp-row">
        <div class="fi fi-lg">
          <div class="flbl">測点名</div>
          <input id="point" type="text" inputmode="url" placeholder="TP.1 / No.5" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
        </div>
        <div class="fi">
          <div class="flbl">SP</div>
          <input id="sp" type="text" inputmode="url" pattern="-?[0-9]*\.?[0-9]*" placeholder="0.000" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
        </div>
        <div class="fi">
          <div class="flbl">FS</div>
          <input id="fs" type="text" inputmode="url" pattern="-?[0-9]*\.?[0-9]*" placeholder="0.000" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
        </div>
        <button class="add-btn" onclick="add()">追加</button>
      </div>
    </div>
  </div>
</div>

<!-- 定点観測 -->
<div class="sec" id="tab-env">
  <div class="dp-wrap">

    <!-- ビューア（写真 + カメラ重ね合わせ） -->
    <div class="dp-viewer" id="dp-viewer">

      <!-- 状態A：写真未登録 -->
      <div class="dp-empty" id="dp-empty">
        <div class="dp-empty-ico">📷</div>
        <div class="dp-empty-txt">基準写真を登録してください</div>
        <label class="btn btn-p dp-upload-btn">
          写真を選択
          <input type="file" id="dp-file-input" accept="image/*" style="display:none">
        </label>
      </div>

      <!-- 状態B：比較モード -->
      <div class="dp-compare" id="dp-compare" style="display:none">
        <!-- 基準写真（半透明オーバーレイ） -->
        <img id="dp-base-img" class="dp-base-img">
        <!-- カメラプレビュー -->
        <video id="dp-video" class="dp-video" autoplay playsinline muted></video>
        <!-- グリッド線 -->
        <canvas id="dp-grid" class="dp-grid"></canvas>
        <!-- 日付バッジ -->
        <div class="dp-date-badge" id="dp-date-badge"></div>
      </div>
    </div>

    <!-- コントロールパネル -->
    <div class="dp-panel" id="dp-panel" style="display:none">
      <div class="dp-ctrl-row">
        <span class="dp-ctrl-lbl">透過度</span>
        <input type="range" id="dp-opacity" min="0" max="100" value="50" class="dp-slider">
        <span class="dp-ctrl-val" id="dp-opacity-val">50%</span>
      </div>
      <div class="dp-ctrl-row">
        <span class="dp-ctrl-lbl">グリッド</span>
        <button class="dp-tog" id="dp-grid-tog" data-on="false">OFF</button>
        <span class="dp-ctrl-val"></span>
      </div>
    </div>

    <!-- ボタン群 -->
    <div class="dp-btns">
      <div id="dp-btns-registered" style="display:none">
        <div class="row2" style="gap:8px;margin-bottom:8px;">
          <button class="btn btn-p" id="dp-camera-btn">📷 カメラ起動</button>
          <button class="btn btn-s" id="dp-capture-btn" style="display:none">🔴 撮影保存</button>
        </div>
        <div class="row2" style="gap:8px;">
          <label class="btn btn-s dp-upload-btn" style="text-align:center;display:block;">
            🔄 写真を更新
            <input type="file" id="dp-file-input2" accept="image/*" style="display:none">
          </label>
          <button class="btn btn-d" id="dp-clear-btn">🗑 削除</button>

<script>
/* ── 数値入力ヘルパー（iPhone対応） ── */
(function(){
  /* 対象フィールドID */
  const numFields=['sp','fs','initGH'];

  /* 入力中：数値として有効な文字以外を除去 */
  function sanitize(el){
    const s=el.value;
    /* 許可：先頭のマイナス、数字、小数点1つのみ */
    let out=s.replace(/[^0-9.\-]/g,'');
    /* マイナスは先頭のみ許可 */
    out=out.replace(/(?!^)-/g,'');
    /* 小数点は最初の1つだけ */
    const parts=out.split('.');
    if(parts.length>2) out=parts[0]+'.'+parts.slice(1).join('');
    if(el.value!==out) el.value=out;
  }

  /* blur時：値があれば3桁フォーマット */
  function autoFmt(el){
    const v=parseFloat(el.value);
    if(!isNaN(v)) el.value=v.toFixed(3);
  }

  document.addEventListener('DOMContentLoaded',function(){},false);
  /* DOMが既に準備済みの場合も考慮して即時実行 */
  function attach(){
    numFields.forEach(id=>{
      const el=document.getElementById(id);
      if(!el) return;
      el.addEventListener('input',()=>sanitize(el));
      el.addEventListener('blur',()=>autoFmt(el));
    });
  }
  /* scriptは末尾なのでDOMは既存 */
  attach();
})();

let data=[], baseIH=null, pendingIH=null, pendingRow=null;

/* ── 時刻 ── */
function tick(){
  const d=new Date();
  document.getElementById('time').textContent=
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
tick(); setInterval(tick,15000);

/* ── 日時デフォルト ── */
(function(){
  const n=new Date(), l=new Date(n-n.getTimezoneOffset()*60000).toISOString().slice(0,16);
  document.getElementById('survey-date').value=l;
})();

/* ── オフライン検知 ── */
function chkOnline(){
  document.getElementById('offline-banner').classList.toggle('show',!navigator.onLine);
}
window.addEventListener('online',chkOnline);
window.addEventListener('offline',chkOnline);
chkOnline();

/* ── タブ ── */
function switchTab(n){
  var tabs = document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){
    tabs[i].classList.remove('active');
    if(tabs[i].dataset.tab===n) tabs[i].classList.add('active');
  }
  var secs = document.querySelectorAll('.sec');
  for(var j=0;j<secs.length;j++) secs[j].classList.remove('active');
  var target = document.getElementById('tab-'+n);
  if(target) target.classList.add('active');
  if(n==='graph') drawChart('chart-full');
}

/* ── BM設定 ── */
function setInit(){
  const gh=parseFloat(document.getElementById('initGH').value);
  if(isNaN(gh)){alert('初期GHを入力してください');return;}
  baseIH=gh;
  const nm=document.getElementById('bmName').value||'BM';
  data=[{point:nm,isBM:true,gh,use:true,ihOverride:null}];
  save(); switchTab('measure');
}

/* ── IH取得（行インデックス基準） ── */
function getIHAt(idx){
  let ih=baseIH;
  for(let i=0;i<idx;i++)
    if(data[i].ihOverride!=null) ih=data[i].ihOverride;
  return ih;
}
function curIH(){return getIHAt(data.length);}

/* ── 自動採番（BM行を除いたカウント） ── */
function nextNo(){return data.filter(d=>!d.isBM).length+1;}

/* ── 追加 ── */
function add(){
  const raw=document.getElementById('point').value.trim();
  const p=raw||String(nextNo());          // 空なら連番
  const spRaw=document.getElementById('sp').value.trim();
  const fsRaw=document.getElementById('fs').value.trim();
  const sp=parseFloat(spRaw);
  const fs=parseFloat(fsRaw);
  if(baseIH===null){alert('設定タブからBMを登録してください');return;}
  const ih=curIH();
  const gh=isNaN(fs)?'':Number((ih+fs).toFixed(3));
  data.push({use:true,point:p,sp:isNaN(sp)?'':sp,ih,fs:isNaN(fs)?'':fs,gh,ihOverride:null});
  document.getElementById('point').value='';
  document.getElementById('sp').value='';
  document.getElementById('fs').value='';
  document.getElementById('point').focus();
  save();
}

/* ── GHタップ ── */
function tapGH(i){
  const d=data[i];
  if(d.gh===''||isNaN(d.gh)) return;
  pendingRow=i; pendingIH=d.gh;
  document.getElementById('modal-v').textContent=fmtN(d.gh);
  const rem=data.length-(i+1);
  document.getElementById('modal-n').textContent=
    rem>0?`${i+2}行目以降（計${rem}行）のIHを更新`:'次の測点から適用';
  document.getElementById('modal').classList.add('open');
}
function closeModalOutside(e){if(e.target===document.getElementById('modal'))closeModal();}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function applyIH(){
  if(pendingRow===null) return;
  data[pendingRow].ihOverride=pendingIH;
  recalcFrom(pendingRow+1);
  closeModal(); save();
}

/* ── IHリセット ── */
function resetIH(){data.forEach(d=>d.ihOverride=null);recalcAll();save();}

/* ── 再計算 ── */
function recalcFrom(s){
  for(let i=s;i<data.length;i++){
    data[i].ih=getIHAt(i);
    if(data[i].fs!=='') data[i].gh=Number((data[i].ih+data[i].fs).toFixed(3));
  }
}
function recalcAll(){recalcFrom(1);}

/* ── ON/OFF ── */
function toggle(i){data[i].use=!data[i].use;save();}

/* ── 削除 ── */
function del(i){
  if(confirm('「'+data[i].point+'」を削除しますか？'))
    {data.splice(i,1);recalcAll();save();}
}

/* ── 保存（localStorage + IndexedDB両刀） ── */
let idb=null;
function openIDB(){
  const req=indexedDB.open('levelSurvey',1);
  req.onupgradeneeded=e=>{e.target.result.createObjectStore('kv');};
  req.onsuccess=e=>{idb=e.target.result;};
}
openIDB();

function idbSave(payload){
  if(!idb) return;
  try{
    const tx=idb.transaction('kv','readwrite');
    tx.objectStore('kv').put(payload,'state');
  }catch(e){}
}
function idbLoad(cb){
  if(!idb){cb(null);return;}
  try{
    const tx=idb.transaction('kv','readonly');
    const req=tx.objectStore('kv').get('state');
    req.onsuccess=()=>cb(req.result||null);
    req.onerror=()=>cb(null);
  }catch(e){cb(null);}
}

function getPayload(){
  return {
    data, baseIH,
    place:document.getElementById('place').value,
    ob1:document.getElementById('observer1').value,
    ob2:document.getElementById('observer2').value,
    surveyDate:document.getElementById('survey-date').value,
    ts:Date.now()
  };
}
function applyPayload(o){
  if(!o) return;
  data=o.data||[]; baseIH=o.baseIH||null;
  if(o.place) document.getElementById('place').value=o.place;
  if(o.ob1)   document.getElementById('observer1').value=o.ob1;
  if(o.ob2)   document.getElementById('observer2').value=o.ob2;
  if(o.surveyDate) document.getElementById('survey-date').value=o.surveyDate;
}

function save(){
  const p=getPayload();
  try{localStorage.setItem('lvl4',JSON.stringify(p));}catch(e){}
  idbSave(p);
  render();
}

/* ── IHバー ── */
function updIHBar(){
  const ih=curIH();
  document.getElementById('ih-val').textContent=ih!=null?fmtN(ih):'--';
  const ov=data.some(d=>d.ihOverride!=null);
  document.getElementById('ih-src').textContent=ov?'（GHより）':'（BM）';
  document.getElementById('ih-rst').style.display=ov?'inline':'none';
}

/* ── フォーマット ── */
function fmtN(v){return Number(v).toFixed(3);}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ── 描画 ── */
function render(){
  updIHBar();
  const empty=document.getElementById('empty-state');
  const tbl=document.getElementById('data-table');
  const tbody=document.getElementById('tbody');
  if(!data.length){empty.style.display='block';tbl.style.display='none';drawChart('chart-inline');return;}
  empty.style.display='none'; tbl.style.display='table';
  tbody.innerHTML='';
  data.forEach((d,i)=>{
    const tr=document.createElement('tr');
    if(!d.use) tr.classList.add('off');
    const fsN=parseFloat(d.fs);
    const fsC=isNaN(fsN)?'':(fsN>0?'fs-plus':fsN<0?'fs-minus':'');
    const ihC=d.ihOverride!=null?'ih-chg':'';
    tr.innerHTML=
      `<td><button class="tog-btn ${d.use?'on':''}" onclick="toggle(${i})">${d.use?'ON':'OFF'}</button></td>`+
      `<td class="td-pt">${escH(d.point)}${d.isBM?'<span class="bm-badge">BM</span>':''}</td>`+
      `<td>${d.sp!==''?fmtN(d.sp):'—'}</td>`+
      `<td class="${ihC}">${d.ih!=null?fmtN(d.ih):'—'}</td>`+
      `<td class="${fsC}">${d.fs!==''?fmtN(d.fs):'—'}</td>`+
      `<td class="gh-tap" onclick="tapGH(${i})">${d.gh!==''&&!isNaN(d.gh)?fmtN(d.gh):'—'}</td>`+
      `<td><button class="del-btn" onclick="del(${i})">×</button></td>`;
    tbody.appendChild(tr);
  });
  /* 最終行にスクロール */
  const last=tbody.lastChild;
  if(last) last.scrollIntoView({block:'nearest'});
  drawChart('chart-inline');
}

/* ── グラフ ── */
function drawChart(id){
  const cv=document.getElementById(id);
  if(!cv) return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth*dpr||300;
  const H=cv.clientHeight*dpr||80;
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,W,H);
  const arr=data.filter(d=>d.use&&d.gh!==''&&!isNaN(d.gh));
  if(arr.length<2){
    ctx.fillStyle='#7070a0';
    ctx.font=`${10*dpr}px -apple-system`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('2点以上入力するとグラフ表示',W/2,H/2);
    return;
  }
  const vals=arr.map(d=>+d.gh);
  const mn=Math.min(...vals), mx=Math.max(...vals), rng=mx-mn||0.001;
  const isSmall=(id==='chart-inline');
  const pL=isSmall?46*dpr:52*dpr, pR=8*dpr, pT=6*dpr, pB=isSmall?6*dpr:18*dpr;
  const gW=W-pL-pR, gH=H-pT-pB;
  /* グリッド */
  ctx.strokeStyle='rgba(42,42,58,1)'; ctx.lineWidth=1;
  const gs=isSmall?2:4;
  for(let i=0;i<=gs;i++){const y=pT+gH*(i/gs);ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();}
  /* ライン */
  ctx.beginPath();
  arr.forEach((d,i)=>{
    const x=pL+i*(gW/(arr.length-1)), y=pT+gH*(1-(+d.gh-mn)/rng);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.strokeStyle='#4f8ef7'; ctx.lineWidth=1.8*dpr; ctx.lineJoin='round'; ctx.stroke();
  /* ポイント */
  const pr=isSmall?2.5*dpr:3.5*dpr;
  arr.forEach((d,i)=>{
    const x=pL+i*(gW/(arr.length-1)), y=pT+gH*(1-(+d.gh-mn)/rng);
    ctx.beginPath();ctx.arc(x,y,pr,0,Math.PI*2);ctx.fillStyle='#4f8ef7';ctx.fill();
    ctx.beginPath();ctx.arc(x,y,pr*.55,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  });
  /* Y軸ラベル */
  ctx.fillStyle='#7070a0';
  ctx.font=`${(isSmall?7.5:8.5)*dpr}px -apple-system`;
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let i=0;i<=gs;i++){
    const v=mn+rng*(1-i/gs), y=pT+gH*(i/gs);
    ctx.fillText(v.toFixed(3),pL-3,y);
  }
  /* X軸ラベル（大きいグラフのみ） */
  if(!isSmall){
    ctx.font=`${7.5*dpr}px -apple-system`;
    ctx.textAlign='center'; ctx.textBaseline='top';
    const st=Math.max(1,Math.ceil(arr.length/5));
    arr.forEach((d,i)=>{
      if(i%st!==0&&i!==arr.length-1) return;
      const x=pL+i*(gW/(arr.length-1));
      ctx.fillStyle='#7070a0';
      ctx.fillText(d.point.length>5?d.point.slice(0,5)+'…':d.point,x,pT+gH+3);
    });
  }
}

/* ── CSV ── */
function downloadCSV(){
  const p=document.getElementById('place').value;
  const o1=document.getElementById('observer1').value;
  const o2=document.getElementById('observer2').value;
  const dt=document.getElementById('survey-date').value;
  let csv='\uFEFF';
  csv+='地点名,'+p+'\n';
  csv+='観測者①,'+o1+'\n';
  csv+='観測者②,'+o2+'\n';
  csv+='測定日時,'+dt+'\n\n';
  /* 環境データ */
  try{
    const env=JSON.parse(localStorage.getItem('lvl4_env')||'{}');
    if(env.waterLevel||env.weather||env.note){
      csv+='--- 河川環境記録 ---\n';
      if(env.savedAt)    csv+='記録日時,'+env.savedAt+'\n';
      if(env.waterLevel) csv+='水位状況,'+env.waterLevel+'\n';
      if(env.flow)       csv+='流況,'+env.flow+'\n';
      if(env.depth)      csv+='概算水深(m),'+env.depth+'\n';
      if(env.vel)        csv+='概算流速(m/s),'+env.vel+'\n';
      if(env.weather)    csv+='天候,'+env.weather+'\n';
      if(env.temp)       csv+='気温(°C),'+env.temp+'\n';
      if(env.windDir)    csv+='風向,'+env.windDir+'\n';
      if(env.windSpeed)  csv+='風速(m/s),'+env.windSpeed+'\n';
      if(env.bed&&env.bed.length)  csv+='河床材料,'+env.bed.join('/')+'\n';
      if(env.bank&&env.bank.length) csv+='護岸状況,'+env.bank.join('/')+'\n';
      if(env.note) csv+='特記事項,"'+env.note.replace(/"/g,'""')+'"\n';
      csv+='\n';
    }
  }catch(ex){}
  csv+='測点,SP,IH,FS,GH\n';
  data.forEach(function(d){
    csv+=d.point+','+(d.sp!==''?d.sp:'')+','+(d.ih!=null?d.ih:'')+','+(d.fs!==''?d.fs:'')+','+(d.gh!==''?d.gh:'')+'\n';
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='level_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

/* ── リセット ── */
function clearAll(){
  if(confirm('全測定データをリセットしますか？（設定情報は残ります）')){
    data=[]; baseIH=null;
    try{localStorage.removeItem('lvl4');}catch(e){}
    if(idb){try{idb.transaction('kv','readwrite').objectStore('kv').delete('state');}catch(e){}}
    render();
  }
}

/* ── 初期ロード：IDB優先、なければlocalStorage ── */
function loadAndRender(){
  idbLoad(idbData=>{
    let lsData=null;
    try{const s=localStorage.getItem('lvl4');if(s)lsData=JSON.parse(s);}catch(e){}
    /* 新しい方を使う */
    const best=(idbData&&lsData)
      ?(idbData.ts>=lsData.ts?idbData:lsData)
      :(idbData||lsData);
    applyPayload(best);
    render();
  });
}

/* IDB open後に読み込む（openが非同期のため少し待つ） */
setTimeout(loadAndRender, 80);

/* ── 河川環境記録 ── */
/* ── 定点観測 ── */
(function(){
  var baseImg    = null;   // DataURL
  var baseDate   = null;   // 撮影日文字列
  var stream     = null;   // MediaStream
  var history    = [];     // [{dataUrl, date}]
  var gridOn     = false;

  /* ローカルストレージから復元 */
  function dpLoad(){
    try{
      var s = localStorage.getItem('lvl4_dp');
      if(!s) return;
      var obj = JSON.parse(s);
      baseImg  = obj.baseImg  || null;
      baseDate = obj.baseDate || null;
      history  = obj.history  || [];
    }catch(e){}
    dpRender();
    dpHistRender();
  }

  function dpSave(){
    try{
      localStorage.setItem('lvl4_dp', JSON.stringify({
        baseImg:baseImg, baseDate:baseDate, history:history
      }));
    }catch(e){ alert('容量不足のため保存できませんでした。履歴を削除してください。'); }
  }

  /* UI切替 */
  function dpRender(){
    var hasBase = !!baseImg;
    document.getElementById('dp-empty').style.display    = hasBase ? 'none' : 'flex';
    document.getElementById('dp-compare').style.display  = hasBase ? 'block' : 'none';
    document.getElementById('dp-panel').style.display    = hasBase ? 'block' : 'none';
    document.getElementById('dp-btns-registered').style.display = hasBase ? 'block' : 'none';
    if(hasBase){
      var img = document.getElementById('dp-base-img');
      img.src = baseImg;
      img.style.opacity = document.getElementById('dp-opacity').value / 100;
      document.getElementById('dp-date-badge').textContent = '基準: ' + (baseDate || '');
    }
  }

  /* 透過スライダー */
  var slider = document.getElementById('dp-opacity');
  var sliderVal = document.getElementById('dp-opacity-val');
  slider.addEventListener('input', function(){
    var v = slider.value;
    sliderVal.textContent = v + '%';
    slider.style.setProperty('--val', v + '%');
    var img = document.getElementById('dp-base-img');
    if(img) img.style.opacity = v / 100;
  });

  /* グリッドトグル */
  document.getElementById('dp-grid-tog').addEventListener('click', function(){
    gridOn = !gridOn;
    this.textContent = gridOn ? 'ON' : 'OFF';
    this.classList.toggle('active', gridOn);
    drawGrid();
  });

  function drawGrid(){
    var cv = document.getElementById('dp-grid');
    var ctx = cv.getContext('2d');
    var W = cv.clientWidth;
    var H = cv.clientHeight;
    cv.width = W; cv.height = H;
    ctx.clearRect(0,0,W,H);
    if(!gridOn) return;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 0.8;
    /* 3x3グリッド */
    for(var i=1;i<3;i++){
      ctx.beginPath(); ctx.moveTo(W*i/3,0); ctx.lineTo(W*i/3,H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,H*i/3); ctx.lineTo(W,H*i/3); ctx.stroke();
    }
    /* 対角線（構図補助） */
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(W,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W,0); ctx.lineTo(0,H); ctx.stroke();
  }

  /* ファイル選択（基準写真登録） */
  function onFileSelect(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      baseImg  = e.target.result;
      baseDate = new Date().toLocaleDateString('ja-JP');
      dpSave();
      dpRender();
    };
    reader.readAsDataURL(file);
  }
  document.getElementById('dp-file-input').addEventListener('change', function(){
    onFileSelect(this.files[0]);
  });
  document.getElementById('dp-file-input2').addEventListener('change', function(){
    onFileSelect(this.files[0]);
  });

  /* カメラ起動 */
  var cameraBtn  = document.getElementById('dp-camera-btn');
  var captureBtn = document.getElementById('dp-capture-btn');
  var video      = document.getElementById('dp-video');

  cameraBtn.addEventListener('click', function(){
    if(stream){
      /* カメラ停止 */
      stream.getTracks().forEach(function(t){ t.stop(); });
      stream = null;
      video.style.display = 'none';
      cameraBtn.textContent = '📷 カメラ起動';
      captureBtn.style.display = 'none';
    } else {
      /* カメラ起動 */
      var constraints = {
        video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} }
      };
      navigator.mediaDevices.getUserMedia(constraints).then(function(s){
        stream = s;
        video.srcObject = s;
        video.style.display = 'block';
        cameraBtn.textContent = '⏹ カメラ停止';
        captureBtn.style.display = '';
        drawGrid();
      }).catch(function(err){
        alert('カメラを起動できませんでした: ' + err.message);
      });
    }
  });

  /* 撮影・保存 */
  captureBtn.addEventListener('click', function(){
    if(!stream) return;
    /* videoフレームをcanvasに描画して保存 */
    var cv = document.createElement('canvas');
    cv.width  = video.videoWidth;
    cv.height = video.videoHeight;
    var ctx = cv.getContext('2d');
    ctx.drawImage(video, 0, 0);
    var dataUrl = cv.toDataURL('image/jpeg', 0.82);
    var date = new Date().toLocaleString('ja-JP');
    history.unshift({ dataUrl:dataUrl, date:date });
    /* 最大5件保存 */
    if(history.length > 5) history = history.slice(0,5);
    dpSave();
    dpHistRender();
    /* フラッシュ演出 */
    var flash = document.createElement('div');
    flash.style.cssText = 'position:absolute;inset:0;background:#fff;opacity:0.8;z-index:99;pointer-events:none;transition:opacity .3s';
    document.getElementById('dp-compare').appendChild(flash);
    setTimeout(function(){ flash.style.opacity='0'; setTimeout(function(){ flash.remove(); },300); }, 50);
  });

  /* 削除 */
  document.getElementById('dp-clear-btn').addEventListener('click', function(){
    if(!confirm('基準写真を削除しますか？')) return;
    if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream=null; }
    baseImg=null; baseDate=null;
    dpSave(); dpRender();
  });

  /* 撮影履歴レンダリング */
  function dpHistRender(){
    var wrap = document.getElementById('dp-history');
    var list = document.getElementById('dp-history-list');
    if(!history.length){ wrap.style.display='none'; return; }
    wrap.style.display='block';
    list.innerHTML='';
    history.forEach(function(item, idx){
      var div = document.createElement('div');
      div.className='dp-hist-item';
      var img = document.createElement('img');
      img.className='dp-hist-thumb'; img.src=item.dataUrl;
      var info = document.createElement('div');
      info.className='dp-hist-info';
      var d = document.createElement('div');
      d.className='dp-hist-date'; d.textContent=item.date;
      info.appendChild(d);
      var del = document.createElement('button');
      del.className='dp-hist-del'; del.textContent='削除';
      del.addEventListener('click', function(e){
        e.stopPropagation();
        if(confirm('この記録を削除しますか？')){
          history.splice(idx,1); dpSave(); dpHistRender();
        }
      });
      /* タップで画像DL */
      img.addEventListener('click', function(){
        var a = document.createElement('a');
        a.href = item.dataUrl;
        a.download = 'survey_' + item.date.replace(/[\/\s:]/g,'-') + '.jpg';
        a.click();
      });
      div.appendChild(img); div.appendChild(info); div.appendChild(del);
      list.appendChild(div);
    });
  }

  /* タブ切替時にグリッド再描画 */
  var origSwitch = window.switchTab;
  window.switchTab = function(n){
    origSwitch(n);
    if(n==='env'){ setTimeout(drawGrid,50); }
  };

  setTimeout(dpLoad, 150);
})();


/* ── オフライン対応：Service Worker を動的生成・登録 ── */
(function(){
  if(!('serviceWorker' in navigator)) return;
  /* 古いSWを全て登録解除してからキャッシュ削除 */
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>r.unregister());
  });
  caches.keys().then(keys=>{
    keys.filter(k=>k!=='level-survey-v3').forEach(k=>caches.delete(k));
  });
  /* SW スクリプトを文字列で定義してBlobURLに変換 */
  const CACHE='level-survey-v3';
  const swCode=`
const CACHE='${CACHE}';
self.addEventListener('install',e=>{
  e.waitUntil(
    caches.open(CACHE).then(c=>c.addAll([location.href.replace(/\\/[^/]*$/,'/')||'/']))
      .catch(()=>{})
  );
  self.skipWaiting();
});
self.addEventListener('activate',e=>{
  e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET') return;
  e.respondWith(
    caches.match(e.request).then(cached=>{
      const net=fetch(e.request).then(res=>{
        if(res&&res.status===200){
          const clone=res.clone();
          caches.open(CACHE).then(c=>c.put(e.request,clone));
        }
        return res;
      }).catch(()=>null);
      return cached||net;
    })
  );
});
`;
  const blob=new Blob([swCode],{type:'application/javascript'});
  const url=URL.createObjectURL(blob);
  navigator.serviceWorker.register(url,{scope:'./'})
    .then(()=>{
      /* 初回登録時：このページ自身をキャッシュに追加 */
      return caches.open(CACHE).then(c=>c.add(location.href));
    })
    .catch(()=>{});
})();
/* ── タブクリックイベント登録 ── */
(function(){
  document.querySelectorAll('.tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      switchTab(btn.dataset.tab);
    });
  });
})();
