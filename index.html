<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>測量値記録</title>

<style>
body { font-family:-apple-system; margin:0; padding:10px; background:#f2f2f7; }
h1 { text-align:center; font-size:18px; }

.card { background:#fff; padding:12px; border-radius:12px; margin-bottom:10px; }

input, button {
  width:100%;
  padding:14px;
  font-size:18px;
  margin-top:5px;
  border-radius:10px;
  border:1px solid #ccc;
}

button { background:#007aff; color:#fff; border:none; }

.record { font-size:14px; border-bottom:1px solid #ddd; padding:6px 0; }
.meta { font-size:11px; color:#888; }
img { width:100%; margin-top:5px; border-radius:8px; }
</style>
</head>

<body>

<h1>測量値記録</h1>

<div class="card">
  <input id="point" placeholder="観測点">
  <button onclick="voiceInput()">🎤 音声入力</button>

  <input id="value" type="number" placeholder="測量値">

  <input id="photo" type="file" accept="image/*" capture="environment">

  <button onclick="saveData()">保存</button>
</div>

<div class="card">
  <div id="list"></div>
</div>

<script>

// 初期表示
loadData();

// 音声入力
function voiceInput() {
  const rec = new webkitSpeechRecognition();
  rec.lang = "ja-JP";
  rec.start();

  rec.onresult = (e) => {
    document.getElementById("point").value =
      e.results[0][0].transcript;
  };
}

// 保存
function saveData(){
  const point = pointEl.value;
  const value = valueEl.value;

  if(!point || !value){
    alert("入力してください");
    return;
  }

  if(!navigator.geolocation){
    save(point,value,"-","-","");
    return;
  }

  navigator.geolocation.getCurrentPosition(pos=>{
    const lat = pos.coords.latitude.toFixed(6);
    const lng = pos.coords.longitude.toFixed(6);

    const file = photo.files[0];
    const reader = new FileReader();

    if(file){
      reader.onload = ()=>save(point,value,lat,lng,reader.result);
      reader.readAsDataURL(file);
    }else{
      save(point,value,lat,lng,"");
    }
  },
  ()=>{
    save(point,value,"-","-","");
  });
}

// 内部保存
function save(p,v,lat,lng,img){
  const data = JSON.parse(localStorage.getItem("surveyData")||"[]");

  data.push({
    point:p,
    value:v,
    time:new Date().toLocaleString(),
    lat,lng,img
  });

  localStorage.setItem("surveyData",JSON.stringify(data));

  pointEl.value="";
  valueEl.value="";
  photo.value="";

  loadData();
}

// 表示
function loadData(){
  const list = document.getElementById("list");
  list.innerHTML="";

  const data = JSON.parse(localStorage.getItem("surveyData")||"[]");

  data.slice().reverse().forEach(d=>{
    const div = document.createElement("div");
    div.className="record";

    div.innerHTML=`
      <b>${d.point}</b> : ${d.value}<br>
      <div class="meta">${d.time}<br>${d.lat}, ${d.lng}</div>
      ${d.img ? `${d.img}` : ""}
    `;

    list.appendChild(div);
  });
}

// 要素
const pointEl = document.getElementById("point");
const valueEl = document.getElementById("value");
const photo = document.getElementById("photo");

</script>

</body>
</html>
