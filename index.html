<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>レベルブック</title>

<style>
:root{
  --bg:#f2f2f7;
  --card:#fff;
  --text:#000;
  --border:#ddd;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000;
    --card:#1c1c1e;
    --text:#fff;
    --border:#333;
  }
}
body{font-family:-apple-system;background:var(--bg);color:var(--text);margin:0;padding:10px;}
input,button{width:100%;padding:12px;font-size:18px;margin-top:5px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);}
button{background:#007aff;color:#fff;border:none;}
table{width:100%;border-collapse:collapse;background:var(--card);}
td,th{border:1px solid var(--border);padding:5px;text-align:center;}
th{background:#007aff;color:white;}
</style>
</head>

<body>

<h1>レベルブック</h1>

<input id="point" placeholder="測点">
<input id="bs" type="number" step="0.001" placeholder="BS">
<input id="ifs" type="number" step="0.001" placeholder="IFS">
<input id="fs" type="number" step="0.001" placeholder="FS">
<button onclick="add()">追加</button>

<table>
<thead>
<tr><th>測点</th><th>BS</th><th>IFS</th><th>FS</th><th>HI</th><th>RL</th></tr>
</thead>
<tbody id="table"></tbody>
</table>

<script>
let data=JSON.parse(localStorage.getItem("level")||"[]");
if(data.length===0){data.push({point:"BM",rl:100});}

function add(){
 const p=point.value;
 const bsV=parseFloat(bs.value);
 const ifsV=parseFloat(ifs.value);
 const fsV=parseFloat(fs.value);

 let last=data[data.length-1];
 let hi=last.hi||last.rl;
 let rl=last.rl;

 if(!isNaN(bsV)) hi=last.rl+bsV;
 if(!isNaN(ifsV)) rl=hi-ifsV;
 if(!isNaN(fsV)) rl=hi-fsV;

 data.push({point:p,bs:bsV||"",ifs:ifsV||"",fs:fsV||"",hi:hi,rl:rl});
 localStorage.setItem("level",JSON.stringify(data));

 point.value="";bs.value="";ifs.value="";fs.value="";
 render();
}

function render(){
 table.innerHTML="";
 data.forEach(d=>{
  let tr=document.createElement("tr");
  tr.innerHTML=`
    <td>${d.point}</td>
    <td>${d.bs||""}</td>
    <td>${d.ifs||""}</td>
    <td>${d.fs||""}</td>
    <td>${d.hi?.toFixed?.(3)||""}</td>
    <td>${d.rl?.toFixed?.(3)||""}</td>`;
  table.appendChild(tr);
 });
}

render();
</script>

</body>
</html>
