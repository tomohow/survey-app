<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:-apple-system;background:#000;color:#fff;padding:10px;}

input,button{
 width:100%;padding:14px;font-size:18px;margin-top:6px;
 border-radius:10px;border:1px solid #333;
 background:#1c1c1e;color:#fff;
}

button{background:#007aff;}

.row{display:flex;gap:6px;}
.row input{flex:1;}

table{width:100%;border-collapse:collapse;margin-top:10px;}
td,th{border:1px solid #333;padding:6px;text-align:center;}
th{background:#007aff;}

.smallBtn{font-size:12px;padding:4px 6px;width:auto;}

.toggle{
 background:#444;
 padding:3px 6px;
 border-radius:5px;
 font-size:11px;
}

canvas{background:#000;margin-top:10px;border-radius:10px;}
.meta{font-size:12px;color:#aaa;margin-bottom:10px;}
</style>
</head>

<body>

<h3>現場情報</h3>
<input id="place" placeholder="地点名">
<input id="observer1" placeholder="測量者①">
<input id="observer2" placeholder="測量者②">

<div class="meta" id="now"></div>

<h3>初期</h3>
<input id="bmName" placeholder="測点名（BM）">
<input id="initGH" type="number" step="0.001" placeholder="初期GH">

<button onclick="setInit()">開始</button>

<h3>入力</h3>
<input id="point" placeholder="測点">
<div class="row">
  <input id="sp" type="number" step="0.001" placeholder="SP">
  <input id="fs" type="number" step="0.001" placeholder="FS">
</div>

<button onclick="add()">追加</button>
<button onclick="downloadCSV()">CSV</button>

<table>
<thead>
<tr>
<th>測点</th><th>SP</th><th>IH</th><th>FS</th><th>GH</th><th>図</th><th></th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<canvas id="chart" width="320" height="200"></canvas>

<script>

let data=[];
let baseIH=null;
let overrideIH=null;

// 日時
function updateTime(){
 let now=new Date();
 document.getElementById("now").innerText=
   "日時："+now.toLocaleString();
}
setInterval(updateTime,1000);
updateTime();

// 初期
function setInit(){
 let gh=parseFloat(initGH.value);
 if(isNaN(gh)) return alert("初期GH入力");

 baseIH=gh;

 data=[{
  point:(bmName.value||"BM")+" (BM)",
  gh:gh,
  use:true
 }];

 save();
}

// 追加
function add(){
 let p=point.value;
 let spV=parseFloat(sp.value);
 let fsV=parseFloat(fs.value);

 if(!p) return alert("測点入力");

 let ih = overrideIH!==null ? overrideIH : baseIH;

 let gh="";
 if(!isNaN(fsV)){
  gh = Number(ih) - Number(fsV);
 }

 data.push({
  point:p,
  sp:isNaN(spV)?"":spV,
  ih:ih,
  fs:isNaN(fsV)?"":fsV,
  gh:gh,
  use:true
 });

 point.value="";sp.value="";fs.value="";
 save();
}

// GHタップ（以降ずっとIH変更）
function copyGH(v){
 if(v==="" || isNaN(v)) return;
 overrideIH=Number(v);
 alert("IH変更："+v);
}

// ON/OFF
function toggle(i){
 data[i].use=!data[i].use;
 save();
}

// 削除
function del(i){
 data.splice(i,1);
 save();
}

// 保存
function save(){
 localStorage.setItem("level",JSON.stringify(data));
 render();
}

// 表示
function render(){
 table.innerHTML="";

 data.forEach((d,i)=>{
  let tr=document.createElement("tr");

  tr.innerHTML=`
   <td>${d.point}</td>
   <td>${d.sp||""}</td>
   <td>${d.ih?.toFixed?.(3)||""}</td>
   <td>${d.fs||""}</td>
   <td onclick="copyGH(${d.gh})">
     ${(d.gh!==""&&!isNaN(d.gh))
        ?Number(d.gh).toFixed(3):""}
   </td>
   <td><span class="toggle" onclick="toggle(${i})">
     ${d.use?"ON":"OFF"}
   </span></td>
   <td><button class="smallBtn" onclick="del(${i})">×</button></td>
  `;
  table.appendChild(tr);
 });

 draw();
}

// CSV
function downloadCSV(){
 let csv=
 `地点名,${place.value}
測量者1,${observer1.value}
測量者2,${observer2.value}\n\n`;

 csv+="測点,SP,IH,FS,GH\n";

 data.forEach(d=>{
  csv+=`${d.point},${d.sp||""},${d.ih||""},${d.fs||""},${d.gh||""}\n`;
 });

 let blob=new Blob([csv]);
 let a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="level.csv";
 a.click();
}

// グラフ
function draw(){
 let ctx=chart.getContext("2d");
 ctx.clearRect(0,0,320,200);

 let arr=data.filter(d=>d.use&&d.gh!=="");

 if(arr.length<2) return;

 let ghList=arr.map(d=>d.gh);
 let min=Math.min(...ghList);
 let max=Math.max(...ghList);

 arr.forEach((d,i)=>{
  let x=i*(320/arr.length);
  let y=200-((d.gh-min)/(max-min))*180;

  ctx.fillStyle="#0af";
  ctx.fillRect(x,y,4,4);

  if(i>0){
   let p=arr[i-1];
   let px=(i-1)*(320/arr.length);
   let py=200-((p.gh-min)/(max-min))*180;

   ctx.beginPath();
   ctx.moveTo(px,py);
   ctx.lineTo(x,y);
   ctx.strokeStyle="#0af";
   ctx.stroke();
  }
 });
}

// 起動時読込
let saved=localStorage.getItem("level");
if(saved){
 data=JSON.parse(saved);
 baseIH=data[0]?.gh||null;
}

render();

</script>

</body>
</html>
