<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:-apple-system;padding:10px;background:#111;color:#fff;}
input,button{
  width:100%;padding:12px;font-size:18px;margin-top:5px;
  border-radius:8px;border:1px solid #333;background:#222;color:white;
}
button{background:#007aff;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
td,th{border:1px solid #444;padding:5px;text-align:center;}
th{background:#007aff;}
.small{font-size:10px;color:#aaa;}
</style>
</head>

<body>

<h3>現場情報</h3>
<input id="place" placeholder="地点名">
<input id="name1" placeholder="測量者①">
<input id="name2" placeholder="測量者②">

<h3>入力</h3>

<input id="point" list="points" placeholder="測点名">
<datalist id="points">
<option>BM</option><option>No.1</option><option>No.2</option>
<option>SP.1</option><option>SP.2</option>
</datalist>

<input id="sp" inputmode="decimal" placeholder="SP">
<input id="fs" inputmode="decimal" placeholder="FS">

<button onclick="add()">追加</button>
<button onclick="downloadCSV()">CSV出力</button>

<table>
<thead>
<tr>
<th>測点</th><th>SP</th><th>IH</th><th>FS</th><th>GH</th><th>操作</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<script>

let data = JSON.parse(localStorage.getItem("level")||"[]");

// 初期
if(data.length===0){
  data.push({point:"BM",gh:100,ihSource:"初期"});
}

let overrideIH = null; // GHタップで変更されるIH

function add(){

  const p=point.value;
  const spV=parseFloat(sp.value);
  const fsV=parseFloat(fs.value);

  let last = data[data.length-1];

  // IH決定（override優先）
  let ih = overrideIH !== null ? overrideIH : last.gh;

  let gh = "";
  if(!isNaN(fsV)){
    gh = ih - fsV;
  }

  data.push({
    point:p,
    sp:spV||"",
    ih:ih,
    fs:fsV||"",
    gh:gh,
    ihSource:overrideIH!==null ? "変更" : last.point
  });

  overrideIH = null;

  localStorage.setItem("level",JSON.stringify(data));

  point.value="";sp.value="";fs.value="";
  render();
}

// GHタップ → 次回IH変更
function copyGH(val){
  if(val==="") return;
  overrideIH = val;
  alert("次のIHにセット："+val);
}

// 削除
function del(i){
  if(confirm("削除する？")){
    data.splice(i,1);
    localStorage.setItem("level",JSON.stringify(data));
    render();
  }
}

// 表示
function render(){
  table.innerHTML="";

  data.forEach((d,i)=>{
    let tr=document.createElement("tr");

    tr.innerHTML=`
    <td>${d.point}</td>
    <td>${d.sp||""}</td>
    <td>${d.ih?.toFixed?.(3)||""}<div class="small">${d.ihSource||""}</div></td>
    <td>${d.fs||""}</td>
    <td onclick="copyGH(${d.gh})">
      ${d.gh!==""?Number(d.gh).toFixed(3):""}
    </td>
    <td><button onclick="del(${i})">削除</button></td>
    `;

    table.appendChild(tr);
  });
}

// CSV
function downloadCSV(){
  let csv="地点名,"+place.value+"\n";
  csv+="測量者1,"+name1.value+"\n";
  csv+="測量者2,"+name2.value+"\n\n";

  csv+="測点,SP,IH,FS,GH\n";

  data.forEach(d=>{
    csv+=`${d.point},${d.sp||""},${d.ih||""},${d.fs||""},${d.gh||""}\n`;
  });

  let blob=new Blob([csv],{type:"text/csv"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="level.csv";
  a.click();
}

render();

</script>

</body>
</html>
